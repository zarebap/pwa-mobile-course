<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Lokalizacja</title>
    </head>
    <body>
        <p id="location">Lokalizacja: </p>
        <p id="orientation">alpha: —, beta: —, gamma: —</p>

        <script>
            const locationOutput = document.getElementById('location');
            const orientationOutput = document.getElementById('orientation');

            navigator.geolocation.watchPosition((position) => {
                locationOutput.textContent = `Szerokość: ${position.coords.latitude}, długość: ${position.coords.longitude}`;
            });

            window.addEventListener('deviceorientation', (event) => {
                orientationOutput.textContent = `alpha: ${event.alpha}, beta: ${event.beta}, gamma: ${event.gamma}`;
            });
        </script>
    </body>
</html>
