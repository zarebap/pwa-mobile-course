<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e3eaf5">
  <title>cosik</title>
  <link rel="stylesheet" href="index.css">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
  <div class="grid">
    <div class="area-a">a</div>
    <div class="area-b">b</div>
    <div class="area-c">c</div>
    <div class="area-d">d</div>
    <div class="area-e">
      <span>e</span>
      <button id="install-btn" class="install-btn" hidden>Zainstaluj aplikację</button>
    </div>
    <div class="area-f">f</div>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js")
          .then((reg) => console.log("SW zarejestrowany, scope:", reg.scope))
          .catch((err) => {
            console.error("Rejestracja service workera nie powiodła się:", err);
          });
      });
    }

    const installBtn = document.getElementById("install-btn");
    let deferredPrompt = null;

    const isStandalone =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true; 

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault(); 
      deferredPrompt = event;
      console.log("beforeinstallprompt odebrany ✔");
    });

    installBtn.addEventListener("click", async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log("Wynik instalacji:", outcome);
        deferredPrompt = null;
        return;
      }
    });

    window.addEventListener("appinstalled", () => {
      console.log("Aplikacja zainstalowana");
      deferredPrompt = null;
      installBtn.hidden = true;
    });

    if (!isStandalone) installBtn.hidden = false;
  </script>
</body>
</html>
