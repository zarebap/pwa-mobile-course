<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Lokalizacja</title>
    </head>
    <body>
        <p id="location">Lokalizacja: </p>

        <script>
            const output = document.getElementById('location');

            if (!navigator.geolocation) {
                output.textContent = 'Geolokalizacja nie jest wspierana przez tę przeglądarkę.';
            } else {
                navigator.geolocation.watchPosition(showPosition, showError, {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 10000,
                });
            }

            function showPosition(position) {
                const { latitude, longitude, accuracy, speed } = position.coords;
                let text = `Szerokość: ${latitude.toFixed(6)}, długość: ${longitude.toFixed(6)} (dokładność ±${Math.round(accuracy)} m)`;

                if (speed !== null) {
                    text += `, prędkość: ${(speed * 3.6).toFixed(1)} km/h`;
                }

                output.textContent = text;
            }

            function showError(error) {
                const messages = {
                    1: 'brak zgody na dostęp do lokalizacji',
                    2: 'lokalizacja niedostępna',
                    3: 'przekroczono czas oczekiwania',
                };
                output.textContent = `Błąd: ${messages[error.code] ?? error.message}`;
            }
        </script>
    </body>
</html>
